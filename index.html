<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Engenharia Castanhel - Ferramentaria</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root {
    --bg: #DADAEE;
    --ink: #101B2F;
    --steel: #3A3A45;
    --accent: #00ABE9;
    --accent-text: #0B6E93;
    --rust: #D64545;
    --green: #2E7D4F;
    --card-bg: #FFFFFF;
    --border: #C3C3DC;
    --muted: #5B5B6B;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: 'Inter', sans-serif;
    background: var(--bg);
    color: var(--ink);
  }
  button { cursor: pointer; font-family: 'Inter', sans-serif; }
  input, select { font-family: 'Inter', sans-serif; }

  .shell {
    display: flex;
    min-height: 100vh;
    width: 100%;
  }
  .page-loading {
    padding: 2rem;
    color: var(--muted);
  }

  /* Sidebar */
  .sidebar {
    width: 200px;
    flex-shrink: 0;
    background: var(--ink);
    display: flex;
    flex-direction: column;
    padding: 1.25rem 0.75rem;
    gap: 4px;
  }
  .sidebar-brand {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 0 0.5rem;
    margin-bottom: 18px;
  }
  .sidebar-brand-mark {
    width: 28px;
    height: 28px;
    border-radius: 4px;
    background: var(--accent);
    color: var(--ink);
    font-family: 'Oswald', sans-serif;
    font-weight: 700;
    font-size: 13px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .sidebar-brand-text {
    font-family: 'Oswald', sans-serif;
    font-size: 13px;
    font-weight: 600;
    color: #FFF;
    line-height: 1.25;
  }
  .sidebar-brand-subtext {
    font-size: 10px;
    color: #A9AFC9;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    margin-top: 1px;
  }
  .nav-item {
    text-align: left;
    padding: 10px 12px;
    font-size: 14px;
    font-weight: 500;
    border: none;
    border-radius: 4px;
    background: transparent;
    color: #A9AFC9;
  }
  .nav-item:hover { background: rgba(255,255,255,0.06); }
  .nav-item-active {
    text-align: left;
    padding: 10px 12px;
    font-size: 14px;
    font-weight: 600;
    border: none;
    border-radius: 4px;
    background: rgba(0,171,233,0.18);
    color: var(--accent);
  }

  .main { flex: 1; min-width: 0; }

  .header {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    padding: 1.75rem 1.5rem 1.25rem;
    border-bottom: 3px solid var(--ink);
    flex-wrap: wrap;
    gap: 12px;
  }
  .eyebrow {
    font-family: 'Oswald', sans-serif;
    font-size: 12px;
    letter-spacing: 0.14em;
    color: var(--steel);
    font-weight: 600;
    margin-bottom: 4px;
  }
  .title {
    font-family: 'Oswald', sans-serif;
    font-size: 34px;
    font-weight: 700;
    margin: 0;
    letter-spacing: 0.01em;
  }
  .header-stats { display: flex; gap: 12px; flex-wrap: wrap; }
  .stat-block {
    border: 2px solid var(--steel);
    border-radius: 4px;
    padding: 6px 16px;
    text-align: center;
    min-width: 84px;
  }
  .stat-block.alert { border-color: var(--rust); }
  .stat-number {
    font-family: 'Oswald', sans-serif;
    font-size: 26px;
    font-weight: 700;
    line-height: 1;
  }
  .stat-number.alert { color: var(--rust); }
  .stat-label {
    font-size: 11px;
    color: var(--muted);
    margin-top: 2px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }

  .toolbar {
    display: flex;
    gap: 10px;
    padding: 1.25rem 1.5rem 0.5rem;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
  }
  .search-input {
    flex: 1 1 220px;
    padding: 10px 12px;
    border: 1.5px solid var(--border);
    border-radius: 4px;
    font-size: 14px;
    background: var(--card-bg);
    outline: none;
  }
  .filter-group { display: flex; gap: 4px; background: #E9E9F5; padding: 3px; border-radius: 4px; }
  .filter-btn {
    padding: 7px 12px;
    font-size: 13px;
    border: none;
    background: transparent;
    color: var(--muted);
    border-radius: 3px;
    font-weight: 500;
  }
  .filter-btn-active {
    padding: 7px 12px;
    font-size: 13px;
    border: none;
    background: var(--ink);
    color: #FFF;
    border-radius: 3px;
    font-weight: 500;
  }
  .add-btn {
    padding: 10px 16px;
    font-size: 14px;
    font-weight: 600;
    border: none;
    border-radius: 4px;
    background: var(--accent);
    color: var(--ink);
  }

  .error-banner {
    margin: 1.25rem 1.5rem 0;
    padding: 10px 14px;
    background: #F6DADA;
    color: var(--rust);
    border-radius: 4px;
    font-size: 13px;
    font-weight: 500;
  }
  .saving-banner { margin: 1.25rem 1.5rem 0; font-size: 12px; color: var(--muted); }

  .filter-bar {
    display: flex;
    gap: 10px;
    padding: 0.5rem 1.5rem 0.25rem;
    flex-wrap: wrap;
    align-items: center;
  }
  .filter-input {
    padding: 8px 10px;
    border: 1.5px solid var(--border);
    border-radius: 4px;
    font-size: 13px;
    background: var(--card-bg);
    color: var(--ink);
    outline: none;
  }
  .date-range-group { display: flex; gap: 6px; align-items: center; }
  .date-range-label { font-size: 12px; color: var(--muted); }
  .clear-filter-btn {
    padding: 8px 12px;
    font-size: 12px;
    font-weight: 500;
    border: none;
    background: transparent;
    color: var(--steel);
    text-decoration: underline;
  }

  .inline-card {
    margin: 1rem 1.5rem 0;
    background: var(--card-bg);
    border: 1.5px solid var(--border);
    border-radius: 6px;
    padding: 1rem;
  }
  .inline-card-title { font-family: 'Oswald', sans-serif; font-size: 15px; font-weight: 600; margin-bottom: 10px; }
  .inline-card-row { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
  .text-input {
    flex: 1 1 200px;
    padding: 10px 12px;
    border: 1.5px solid var(--border);
    border-radius: 4px;
    font-size: 14px;
    outline: none;
  }
  .select-input {
    flex: 1 1 200px;
    padding: 10px 12px;
    border: 1.5px solid var(--border);
    border-radius: 4px;
    font-size: 14px;
    outline: none;
    background: var(--card-bg);
    color: var(--ink);
  }
  .hint-text { font-size: 12px; color: var(--muted); margin-top: -4px; margin-bottom: 10px; }
  .inline-card-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 12px; }

  .ghost-btn {
    padding: 9px 14px;
    font-size: 13px;
    font-weight: 500;
    border: 1.5px solid var(--border);
    border-radius: 4px;
    background: transparent;
    color: var(--ink);
  }
  .primary-btn {
    padding: 9px 16px;
    font-size: 13px;
    font-weight: 600;
    border: none;
    border-radius: 4px;
    background: var(--steel);
    color: #FFF;
  }
  .empty-state { margin: 2rem 1.5rem; text-align: center; color: var(--muted); font-size: 14px; }

  .list { display: flex; flex-direction: column; gap: 10px; padding: 1rem 1.5rem 2rem; }

  .tag-card {
    display: flex;
    align-items: center;
    gap: 14px;
    background: var(--card-bg);
    border: 1.5px solid var(--border);
    border-left: 6px solid var(--steel);
    border-radius: 4px;
    padding: 12px 16px;
    flex-wrap: wrap;
  }
  .punch-hole {
    width: 12px; height: 12px; border-radius: 50%;
    background: var(--bg); border: 1.5px solid var(--border); flex-shrink: 0;
  }
  .tag-body { display: flex; flex: 1; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
  .tag-main { min-width: 160px; }
  .tag-name { font-family: 'Oswald', sans-serif; font-size: 17px; font-weight: 600; }
  .tag-name-clickable {
    font-family: 'Oswald', sans-serif; font-size: 17px; font-weight: 600;
    cursor: pointer; text-decoration: underline; text-decoration-color: transparent;
  }
  .tag-name-clickable:hover { text-decoration-color: var(--ink); }
  .tag-meta-row { display: flex; gap: 10px; margin-top: 2px; flex-wrap: wrap; align-items: center; }
  .tag-code { font-size: 12px; color: var(--muted); }
  .tag-value { font-size: 12px; color: var(--steel); font-weight: 600; }
  .tag-obra { font-size: 12px; color: var(--ink); background: #E9E9F5; padding: 2px 8px; border-radius: 3px; font-weight: 500; }

  .card-thumb { width: 48px; height: 48px; object-fit: cover; border-radius: 4px; border: 1.5px solid var(--border); flex-shrink: 0; cursor: pointer; }
  .card-thumb-placeholder { width: 48px; height: 48px; border-radius: 4px; border: 1.5px dashed var(--border); flex-shrink: 0; background: var(--bg); }

  .photo-section { margin-top: 2px; }
  .photo-row { display: flex; gap: 8px; flex-wrap: wrap; }
  .photo-thumb-wrap { position: relative; width: 64px; height: 64px; }
  .photo-thumb { width: 64px; height: 64px; object-fit: cover; border-radius: 4px; border: 1.5px solid var(--border); }
  .photo-remove-btn {
    position: absolute; top: -6px; right: -6px; width: 20px; height: 20px; border-radius: 50%;
    border: 1.5px solid var(--border); background: var(--card-bg); color: var(--rust); font-size: 11px; line-height: 1; padding: 0;
  }
  .photo-add-btn {
    width: 64px; height: 64px; display: flex; align-items: center; justify-content: center;
    border: 1.5px dashed var(--border); border-radius: 4px; font-size: 12px; color: var(--muted); text-align: center; cursor: pointer;
  }

  .tag-status { min-width: 170px; }
  .status-available { font-size: 13px; font-weight: 600; color: var(--green); }
  .status-loaned-title { font-size: 13px; font-weight: 600; color: var(--rust); }
  .status-maintenance-title { font-size: 13px; font-weight: 600; color: var(--accent-text); }
  .status-loaned-sub { font-size: 12px; color: var(--muted); margin-top: 2px; }

  .tag-actions { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .loan-btn { padding: 8px 14px; font-size: 13px; font-weight: 600; border: none; border-radius: 4px; background: var(--ink); color: #FFF; }
  .maintenance-btn { padding: 8px 14px; font-size: 13px; font-weight: 600; border: 1.5px solid var(--accent); border-radius: 4px; background: transparent; color: var(--accent-text); }
  .return-btn { padding: 8px 14px; font-size: 13px; font-weight: 600; border: 1.5px solid var(--steel); border-radius: 4px; background: transparent; color: var(--steel); }
  .remove-btn { padding: 6px 8px; font-size: 12px; border: none; background: transparent; color: var(--muted); text-decoration: underline; }

  .obra-card {
    display: flex; justify-content: space-between; align-items: center; gap: 14px;
    background: var(--card-bg); border: 1.5px solid var(--border); border-left: 6px solid var(--accent);
    border-radius: 4px; padding: 14px 16px; flex-wrap: wrap;
  }
  .obra-main { min-width: 220px; }
  .obra-people-row { display: flex; gap: 16px; margin-top: 4px; flex-wrap: wrap; }
  .obra-person { font-size: 13px; color: var(--muted); }
  .obra-right { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  .obra-tool-count { font-size: 12px; color: var(--steel); font-weight: 600; }

  .report-tag { font-size: 11px; color: var(--muted); font-weight: 400; text-transform: uppercase; letter-spacing: 0.04em; }

  .report-section { margin-bottom: 8px; }
  .report-section-header { display: flex; justify-content: space-between; align-items: center; padding: 1.25rem 1.5rem 0.5rem; flex-wrap: wrap; gap: 8px; }
  .report-section-title { font-family: 'Oswald', sans-serif; font-size: 18px; font-weight: 600; margin: 0; }
  .report-count { font-size: 12px; color: var(--muted); font-weight: 500; }
  .report-row {
    display: flex; justify-content: space-between; align-items: center; gap: 12px;
    background: var(--card-bg); border: 1.5px solid var(--border); border-radius: 4px; padding: 10px 16px; flex-wrap: wrap;
  }
  .report-actions { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .export-btn { padding: 7px 12px; font-size: 12px; font-weight: 600; border: 1.5px solid var(--steel); border-radius: 4px; background: transparent; color: var(--steel); }

  .history-card { display: flex; align-items: center; gap: 14px; background: var(--card-bg); border: 1.5px solid var(--border); border-radius: 4px; padding: 12px 16px; flex-wrap: wrap; }
  .history-badge { flex-shrink: 0; font-size: 11px; font-weight: 600; padding: 5px 10px; border-radius: 3px; text-transform: uppercase; letter-spacing: 0.04em; }
  .history-body { flex: 1; min-width: 0; }
  .history-description { font-size: 13px; color: var(--muted); margin-top: 2px; }
  .history-meta-row { display: flex; gap: 8px; margin-top: 4px; flex-wrap: wrap; }
  .history-date { flex-shrink: 0; font-size: 12px; color: var(--muted); font-weight: 500; }

  .modal-overlay {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(16,27,47,0.55); display: flex; align-items: center; justify-content: center;
    padding: 16px; z-index: 10;
  }
  .modal { background: var(--card-bg); border-radius: 6px; padding: 1.5rem; width: 100%; max-width: 380px; max-height: 90vh; overflow-y: auto; }
  .modal-wide { max-width: 480px; }
  .modal-title { font-family: 'Oswald', sans-serif; font-size: 17px; font-weight: 600; margin-bottom: 12px; }
  .modal-label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 6px; font-weight: 500; }
  .modal-error { font-size: 12px; color: var(--rust); margin-top: 8px; }
  .modal .text-input, .modal .select-input { width: 100%; margin-bottom: 0; }

  .preview-photos { display: flex; gap: 10px; flex-wrap: wrap; }
  .preview-photo { width: 130px; height: 130px; object-fit: cover; border-radius: 4px; border: 1.5px solid var(--border); cursor: pointer; transition: opacity 0.15s; }
  .preview-photo:hover { opacity: 0.85; }
  .detail-photo { width: 72px; height: 72px; object-fit: cover; border-radius: 4px; border: 1.5px solid var(--border); cursor: pointer; transition: opacity 0.15s; }
  .detail-photo:hover { opacity: 0.85; }

  .preview-photo-wrap { display: flex; flex-direction: column; gap: 6px; align-items: center; }
  .preview-photo-actions { display: flex; gap: 8px; align-items: center; }
  .preview-photo-replace {
    font-size: 12px; color: var(--accent-text); font-weight: 600; cursor: pointer; text-decoration: underline;
  }
  .photo-add-btn-lg { width: 130px; height: 130px; font-size: 13px; }

  .lightbox-overlay { background: rgba(16,27,47,0.85); z-index: 20; }
  .lightbox-content {
    position: relative; max-width: 92vw; max-height: 90vh; display: flex; align-items: center; justify-content: center;
  }
  .lightbox-img { max-width: 92vw; max-height: 88vh; object-fit: contain; border-radius: 4px; display: block; }
  .lightbox-close {
    position: absolute; top: -14px; right: -14px; width: 34px; height: 34px; border-radius: 50%;
    border: none; background: #FFF; color: var(--ink); font-size: 20px; line-height: 1; cursor: pointer;
    display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 8px rgba(0,0,0,0.3);
  }
  .lightbox-nav {
    position: absolute; top: 50%; transform: translateY(-50%); width: 40px; height: 40px; border-radius: 50%;
    border: none; background: rgba(255,255,255,0.85); color: var(--ink); font-size: 16px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  .lightbox-prev { left: -10px; }
  .lightbox-next { right: -10px; }
  .lightbox-counter {
    position: absolute; bottom: -30px; left: 50%; transform: translateX(-50%);
    font-size: 12px; color: #FFF; background: rgba(0,0,0,0.4); padding: 3px 10px; border-radius: 10px;
  }
  .detail-readonly-row { display: flex; justify-content: space-between; align-items: center; margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--border); flex-wrap: wrap; gap: 8px; }

  /* Login */
  .login-page {
    min-height: 100vh;
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--ink);
    padding: 16px;
  }
  .login-card {
    background: var(--card-bg);
    border-radius: 8px;
    padding: 2rem;
    width: 100%;
    max-width: 360px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.35);
  }
  .login-brand { display: flex; align-items: center; gap: 10px; margin-bottom: 22px; }
  .login-brand-text { font-family: 'Oswald', sans-serif; font-size: 15px; font-weight: 600; color: var(--ink); line-height: 1.25; }
  .login-brand-subtext { font-size: 10px; color: var(--muted); letter-spacing: 0.06em; text-transform: uppercase; }
  .login-title { font-family: 'Oswald', sans-serif; font-size: 22px; font-weight: 700; margin: 0 0 18px; }
  .login-field { margin-bottom: 14px; }
  .login-field label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 6px; font-weight: 500; }
  .login-field input {
    width: 100%; padding: 11px 12px; border: 1.5px solid var(--border); border-radius: 4px; font-size: 14px; outline: none;
  }
  .login-field input:focus { border-color: var(--accent); }
  .login-btn {
    width: 100%; padding: 11px; font-size: 14px; font-weight: 600; border: none; border-radius: 4px;
    background: var(--accent); color: var(--ink); margin-top: 6px;
  }
  .login-error { font-size: 13px; color: var(--rust); margin-bottom: 10px; }
  .login-hint { font-size: 11px; color: var(--muted); margin-top: 16px; text-align: center; }

  /* Usuarios */
  .sidebar-footer { margin-top: auto; padding: 10px 0.5rem 0; border-top: 1px solid rgba(255,255,255,0.1); }
  .sidebar-user-name { font-size: 12px; color: #FFF; font-weight: 600; padding: 0 0.5rem; margin-bottom: 6px; }
  .sidebar-user-role { font-size: 10px; color: #A9AFC9; padding: 0 0.5rem; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.05em; }
  .logout-btn {
    width: 100%; text-align: left; padding: 8px 12px; font-size: 13px; font-weight: 500;
    border: none; border-radius: 4px; background: transparent; color: #A9AFC9;
  }
  .logout-btn:hover { background: rgba(255,255,255,0.06); color: #FFF; }

  .user-card {
    display: flex; justify-content: space-between; align-items: center; gap: 14px;
    background: var(--card-bg); border: 1.5px solid var(--border); border-left: 6px solid var(--ink);
    border-radius: 4px; padding: 14px 16px; flex-wrap: wrap;
  }
  .user-card.is-admin { border-left-color: var(--accent); }
  .admin-badge {
    font-size: 11px; font-weight: 600; padding: 3px 8px; border-radius: 3px; background: #D6EFFA; color: var(--accent-text);
    text-transform: uppercase; letter-spacing: 0.04em;
  }
  .perm-tags { display: flex; gap: 6px; margin-top: 6px; flex-wrap: wrap; }
  .perm-tag { font-size: 11px; color: var(--muted); background: #E9E9F5; padding: 2px 7px; border-radius: 3px; }

  .checkbox-row { display: flex; align-items: center; gap: 8px; }
  .checkbox-row label { font-size: 13px; color: var(--ink); font-weight: 500; }
  .perm-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px 16px; margin: 10px 0; }
  .perm-grid .checkbox-row label { font-size: 13px; font-weight: 400; color: var(--steel); }

  .perm-list { margin: 10px 0; display: flex; flex-direction: column; gap: 10px; }
  .perm-page-block { border: 1px solid var(--border); border-radius: 4px; padding: 8px 10px; background: #FAFAFD; }
  .perm-actions-list { margin: 8px 0 2px 26px; display: flex; flex-direction: column; gap: 6px; }
  .perm-action-row label { font-size: 12px; font-weight: 400; color: var(--steel); }

  @media (max-width: 720px) {
    .shell { flex-direction: column; }
    .sidebar { width: 100%; flex-direction: row; overflow-x: auto; align-items: center; }
    .sidebar-brand { margin-bottom: 0; }
    .nav-item, .nav-item-active { white-space: nowrap; }
  }
</style>
</head>
<body>
<div id="app"></div>

<script>
/* =========================================================
   Utilidades
   ========================================================= */
const STORAGE_KEY = "controle-ferramentas:dados";
const MAX_PHOTOS = 3;
const MAX_PHOTO_BYTES = 900000;

const uid = () => Math.random().toString(36).slice(2, 10);

function formatDate(iso) {
  if (!iso) return "";
  const d = new Date(iso + "T00:00:00");
  return d.toLocaleDateString("pt-BR", { day: "2-digit", month: "2-digit", year: "numeric" });
}

function diasEmprestada(iso) {
  const ms = Date.now() - new Date(iso + "T00:00:00").getTime();
  return Math.max(0, Math.floor(ms / 86400000));
}

function formatMoney(value) {
  const n = Number(value);
  if (!n && n !== 0) return "";
  return n.toLocaleString("pt-BR", { style: "currency", currency: "BRL" });
}

function parseDecimalInput(value) {
  if (value == null) return null;
  const str = String(value).trim();
  if (!str) return null;
  const normalized = str.replace(",", ".");
  const n = Number(normalized);
  return isNaN(n) ? null : n;
}

function escapeHtml(value) {
  return String(value ?? "").replace(/[&<>"']/g, (c) => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
  }[c]));
}

function escapeAttr(value) {
  return escapeHtml(value).replace(/`/g, "&#96;");
}

function fileToDataUrl(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = () => reject(new Error("Falha ao ler imagem"));
    reader.readAsDataURL(file);
  });
}

function exportToExcel(rows, columns, filename) {
  const data = rows.map((row) => {
    const obj = {};
    for (const col of columns) obj[col.label] = row[col.key] ?? "";
    return obj;
  });
  const ws = XLSX.utils.json_to_sheet(data);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "Relatorio");
  XLSX.writeFile(wb, filename);
}

function escapePdfText(value) {
  return String(value ?? "").replace(/\\/g, "\\\\").replace(/\(/g, "\\(").replace(/\)/g, "\\)");
}

function truncateForPdf(value, maxChars) {
  const s = String(value ?? "");
  return s.length > maxChars ? s.slice(0, Math.max(0, maxChars - 1)) + "\u2026" : s;
}

function buildPdfBlob(title, rows, columns) {
  const pageWidth = 595.28;
  const pageHeight = 841.89;
  const marginX = 36;
  const marginTop = 56;
  const marginBottom = 40;
  const lineHeight = 15;
  const usableWidth = pageWidth - marginX * 2;
  const colWidth = usableWidth / Math.max(1, columns.length);
  const maxCharsPerCol = Math.max(6, Math.floor(colWidth / 4.6));

  const rowsPerPage = Math.max(5, Math.floor((pageHeight - marginTop - marginBottom - 40) / lineHeight));
  const pages = [];
  for (let i = 0; i < rows.length; i += rowsPerPage) pages.push(rows.slice(i, i + rowsPerPage));
  if (pages.length === 0) pages.push([]);

  function textCmd(x, y, text, font, size) {
    return `BT\n/${font} ${size} Tf\n1 0 0 1 ${x.toFixed(2)} ${y.toFixed(2)} Tm\n(${escapePdfText(text)}) Tj\nET\n`;
  }

  const pageContents = pages.map((pageRows, pageIndex) => {
    let y = pageHeight - marginTop;
    let content = "";
    content += textCmd(marginX, y, truncateForPdf(title, 90), "FB", 15);
    y -= 18;
    if (pageIndex === 0) {
      content += textCmd(marginX, y, `Gerado em ${new Date().toLocaleString("pt-BR")} - ${rows.length} registro(s)`, "F1", 9);
    } else {
      content += textCmd(marginX, y, `(continuação - página ${pageIndex + 1})`, "F1", 9);
    }
    y -= 18;
    columns.forEach((col, ci) => {
      content += textCmd(marginX + ci * colWidth, y, truncateForPdf(col.label, maxCharsPerCol), "FB", 10);
    });
    y -= 6;
    content += `${marginX.toFixed(2)} ${y.toFixed(2)} m ${(pageWidth - marginX).toFixed(2)} ${y.toFixed(2)} l S\n`;
    y -= 13;
    pageRows.forEach((row) => {
      columns.forEach((col, ci) => {
        content += textCmd(marginX + ci * colWidth, y, truncateForPdf(row[col.key], maxCharsPerCol), "F1", 9);
      });
      y -= lineHeight;
    });
    return content;
  });

  const parts = [];
  let offset = 0;
  const offsets = [];
  function push(str) { parts.push(str); offset += str.length; }

  push("%PDF-1.4\n%\xE2\xE3\xCF\xD3\n");

  const catalogObjNum = 1;
  const pagesObjNum = 2;
  const fontObjNum = 3;
  const fontBoldObjNum = 4;
  let nextObjNum = 5;
  const pageObjNums = [];
  const contentObjNums = [];
  pageContents.forEach(() => {
    pageObjNums.push(nextObjNum++);
    contentObjNums.push(nextObjNum++);
  });

  offsets[catalogObjNum] = offset;
  push(`${catalogObjNum} 0 obj\n<< /Type /Catalog /Pages ${pagesObjNum} 0 R >>\nendobj\n`);

  offsets[pagesObjNum] = offset;
  const kids = pageObjNums.map((n) => `${n} 0 R`).join(" ");
  push(`${pagesObjNum} 0 obj\n<< /Type /Pages /Kids [${kids}] /Count ${pageObjNums.length} >>\nendobj\n`);

  offsets[fontObjNum] = offset;
  push(`${fontObjNum} 0 obj\n<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>\nendobj\n`);

  offsets[fontBoldObjNum] = offset;
  push(`${fontBoldObjNum} 0 obj\n<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>\nendobj\n`);

  pageContents.forEach((content, idx) => {
    const pageObjNum = pageObjNums[idx];
    const contentObjNum = contentObjNums[idx];

    offsets[pageObjNum] = offset;
    push(
      `${pageObjNum} 0 obj\n<< /Type /Page /Parent ${pagesObjNum} 0 R /MediaBox [0 0 ${pageWidth} ${pageHeight}] ` +
      `/Resources << /Font << /F1 ${fontObjNum} 0 R /FB ${fontBoldObjNum} 0 R >> >> /Contents ${contentObjNum} 0 R >>\nendobj\n`
    );

    offsets[contentObjNum] = offset;
    push(`${contentObjNum} 0 obj\n<< /Length ${content.length} >>\nstream\n${content}\nendstream\nendobj\n`);
  });

  const xrefStart = offset;
  const totalObjs = nextObjNum - 1;
  let xref = `xref\n0 ${totalObjs + 1}\n0000000000 65535 f \n`;
  for (let i = 1; i <= totalObjs; i++) {
    xref += `${String(offsets[i] ?? 0).padStart(10, "0")} 00000 n \n`;
  }
  push(xref);
  push(`trailer\n<< /Size ${totalObjs + 1} /Root ${catalogObjNum} 0 R >>\nstartxref\n${xrefStart}\n%%EOF`);

  const fullStr = parts.join("");
  const bytes = new Uint8Array(fullStr.length);
  for (let i = 0; i < fullStr.length; i++) bytes[i] = fullStr.charCodeAt(i) & 0xff;
  return new Blob([bytes], { type: "application/pdf" });
}

function downloadPdfReport(title, rows, columns, filename) {
  const blob = buildPdfBlob(title, rows, columns);
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 30000);
}

  ],
};

function emptyPermissions() {
  const perms = {};
  PAGES.forEach((p) => { perms[p.key] = true; });
  return perms;
}

function emptyActionsForPage(pageKey) {
  const acts = {};
  (PAGE_ACTIONS[pageKey] || []).forEach((a) => { acts[a.key] = true; });
  return acts;
}

function emptyActions() {
  const obj = {};
  PAGES.forEach((p) => { obj[p.key] = emptyActionsForPage(p.key); });
  return obj;
}

function cloneActions(actions) {
  const obj = {};
  PAGES.forEach((p) => { obj[p.key] = { ...emptyActionsForPage(p.key), ...((actions && actions[p.key]) || {}) }; });
  return obj;
}

function canAccessPage(user, page) {
  if (!user) return false;
  if (page === "usuarios") return !!user.isAdmin;
  if (user.isAdmin) return true;
  return !!(user.permissions && user.permissions[page]);
}

function canDo(user, page, actionKey) {
  if (!user) return false;
  if (user.isAdmin) return true;
  if (!canAccessPage(user, page)) return false;
  const pageActs = user.actions && user.actions[page];
  if (!pageActs) return true;
  return pageActs[actionKey] !== false;
}

function firstAccessiblePage(user) {
  const found = PAGES.find((p) => canAccessPage(user, p.key));
  return found ? found.key : "proprias";
}

/* =========================================================
   Persistencia
   ========================================================= */
async function loadData() {
  let needsSeed = false;
  try {
    const res = await window.storage.get(STORAGE_KEY, true);
    if (res && res.value) {
      const data = JSON.parse(res.value);
      S.tools = data.tools || [];
      S.loans = data.loans || [];
      S.obras = data.obras || [];
      S.rentedTools = data.rentedTools || [];
      S.history = data.history || [];
      S.maintenances = data.maintenances || [];
      S.users = data.users || [];
      if (S.users.length === 0) needsSeed = true;
    } else {
      needsSeed = true;
    }
  } catch (e) {
    needsSeed = true;
  } finally {
    if (needsSeed) {
      S.users = [{
        id: uid(),
        username: "admin",
        password: "admin",
        name: "Administrador",
        isAdmin: true,
        permissions: emptyPermissions(),
        actions: emptyActions(),
      }];
    }
    S.loaded = true;
    render();
    if (needsSeed) persist();
  }
}

async function persist() {
  S.saving = true;
  S.error = "";
  render();
  try {
    const result = await window.storage.set(
      STORAGE_KEY,
      JSON.stringify({
        tools: S.tools,
        loans: S.loans,
        obras: S.obras,
        rentedTools: S.rentedTools,
        history: S.history,
        maintenances: S.maintenances,
        users: S.users,
      }),
      true
    );
    if (!result) throw new Error("sem resultado");
  } catch (e) {
    S.error = "Não foi possível salvar. Tente novamente.";
  } finally {
    S.saving = false;
    render();
  }
}

function logHistory(entry) {
  S.history.unshift({ id: uid(), date: new Date().toISOString().slice(0, 10), ...entry });
}

function addTool() {
  const name = S.newTool.name.trim();
  if (!name) { S.error = "Digite o nome da ferramenta."; render(); return; }
  const tool = {
    id: uid(),
    name,
    code: S.newTool.code.trim(),
    value: parseDecimalInput(S.newTool.value),
    obraId: S.newTool.obraId || null,
    photos: S.newTool.photos,
    createdAt: new Date().toISOString().slice(0, 10),
  };
  S.tools.push(tool);
  const obraName = tool.obraId ? (S.obras.find((o) => o.id === tool.obraId) || {}).name : null;
  logHistory({
    toolId: tool.id, toolName: tool.name, toolCode: tool.code, obraId: tool.obraId,
    type: "cadastro",
    description: obraName ? `Ferramenta cadastrada, já alocada na obra ${obraName}` : "Ferramenta cadastrada",
  });
  S.newTool = emptyTool();
  S.showAddTool = false;
  S.error = "";
  persist();
}

async function handlePhotoSelect(input) {
  const target = input.getAttribute("data-photo-target");
  const indexAttr = input.getAttribute("data-photo-index");
  const files = Array.from(input.files || []);
  input.value = "";
  if (!files.length) return;

  // Troca direta de uma foto especifica de uma ferramenta ja existente
  if (target === "preview" && indexAttr !== null) {
    if (!canDo(S.currentUser, "proprias", "editTool")) {
      S.error = "Você não tem permissão para essa ação.";
      render();
      return;
    }
    const file = files[0];
    if (file.size > MAX_PHOTO_BYTES) {
      S.error = `A imagem "${file.name}" é muito grande. Use fotos menores.`;
      render();
      return;
    }
    S.photoLoading = true;
    render();
    try {
      const url = await fileToDataUrl(file);
      S.preview.photos[Number(indexAttr)] = url;
      S.error = "";
      S.photoLoading = false;
      persist();
    } catch (e) {
      S.error = "Não foi possível carregar a imagem.";
      S.photoLoading = false;
      render();
    }
    return;
  }

  // Adicionar novas fotos (cadastro de ferramenta OU ferramenta ja existente)
  const isPreview = target === "preview";
  if (isPreview && !canDo(S.currentUser, "proprias", "editTool")) {
    S.error = "Você não tem permissão para essa ação.";
    render();
    return;
  }
  const photosArray = isPreview ? S.preview.photos : S.newTool.photos;
  const remaining = MAX_PHOTOS - photosArray.length;
  if (remaining <= 0) {
    S.error = `Máximo de ${MAX_PHOTOS} fotos por ferramenta.`;
    render();
    return;
  }
  const toAdd = files.slice(0, remaining);
  if (files.length > remaining) {
    S.error = `Máximo de ${MAX_PHOTOS} fotos por ferramenta. Algumas imagens não foram adicionadas.`;
  } else {
    S.error = "";
  }
  S.photoLoading = true;
  render();
  try {
    for (const file of toAdd) {
      if (file.size > MAX_PHOTO_BYTES) {
        S.error = `A imagem "${file.name}" é muito grande. Use fotos menores.`;
        continue;
      }
      const url = await fileToDataUrl(file);
      photosArray.push(url);
    }
    if (isPreview) {
      S.preview.photos = S.preview.photos.slice(0, MAX_PHOTOS);
    } else {
      S.newTool.photos = S.newTool.photos.slice(0, MAX_PHOTOS);
    }
  } catch (e) {
    S.error = "Não foi possível carregar uma das imagens.";
  } finally {
    S.photoLoading = false;
    if (isPreview) {
      persist();
    } else {
      render();
    }
  }
}

function removeNewPhoto(index) {
  S.newTool.photos = S.newTool.photos.filter((_, i) => i !== index);

}

function removePreviewPhoto(index) {
  if (!canDo(S.currentUser, "proprias", "editTool")) {
    S.error = "Você não tem permissão para essa ação.";
    render();
    return;
  }
  S.preview.photos = S.preview.photos.filter((_, i) => i !== Number(index));
  if (S.lightbox && S.lightbox.source === "preview") {
    if (S.preview.photos.length === 0) S.lightbox = null;
    else if (S.lightbox.index >= S.preview.photos.length) S.lightbox.index = S.preview.photos.length - 1;
  }
  persist();
}

function openToolDetail(toolId) {
  const tool = S.tools.find((t) => t.id === toolId);
  S.toolDetail = tool;
  S.toolEditForm = { name: tool.name, value: tool.value != null ? String(tool.value) : "", obraId: tool.obraId || "" };
  S.error = "";
  render();
}

function saveToolDetail() {
  const tool = S.toolDetail;
  const newName = S.toolEditForm.name.trim();
  if (!newName) { S.error = "O nome da ferramenta não pode ficar vazio."; render(); return; }
  const newValue = parseDecimalInput(S.toolEditForm.value);
  const newObraId = S.toolEditForm.obraId || null;

  const events = [];
  if (newName !== tool.name) {
    events.push({
      toolId: tool.id, toolName: newName, toolCode: tool.code, obraId: newObraId, type: "edicao",
      description: `Nome alterado de "${tool.name}" para "${newName}"`,
    });
  }
  if (newValue !== tool.value) {
    events.push({
      toolId: tool.id, toolName: newName, toolCode: tool.code, obraId: newObraId, type: "edicao",
      description: (tool.value != null ? `Valor alterado de ${formatMoney(tool.value)}` : "Valor definido")
        + (newValue != null ? ` para ${formatMoney(newValue)}` : " para vazio"),
    });
  }
  if (newObraId !== (tool.obraId || null)) {
    const oldObraName = tool.obraId ? (S.obras.find((o) => o.id === tool.obraId) || {}).name : null;
    const newObraName = newObraId ? (S.obras.find((o) => o.id === newObraId) || {}).name : null;
    const description = oldObraName && newObraName
      ? `Trocou de obra: ${oldObraName} -> ${newObraName}`
      : newObraName ? `Alocada na obra ${newObraName}` : `Removida da obra ${oldObraName}`;
    events.push({ toolId: tool.id, toolName: newName, toolCode: tool.code, obraId: newObraId, type: "obra", description });
  }

  if (events.length === 0) {
    S.toolDetail = null;
    S.toolEditForm = null;
    render();
    return;
  }

  tool.name = newName;
  tool.value = newValue;
  tool.obraId = newObraId;
  events.forEach(logHistory);

  S.toolDetail = null;
  S.toolEditForm = null;
  S.error = "";
  persist();
}

   ========================================================= */
function addUser() {
  const username = S.newUser.username.trim();
  const password = S.newUser.password;
  if (!username) { S.error = "Digite o nome de usuário."; render(); return; }
  if (!password) { S.error = "Digite uma senha."; render(); return; }
  if (S.users.some((u) => u.username.toLowerCase() === username.toLowerCase())) {
    S.error = "Já existe um usuário com esse nome.";
    render();
    return;
  }
  S.users.push({
    id: uid(),
    username,
    password,
    name: S.newUser.name.trim(),
    isAdmin: !!S.newUser.isAdmin,
    permissions: { ...S.newUser.permissions },
    actions: cloneActions(S.newUser.actions),
  });
  S.newUser = emptyUser();
  S.showAddUser = false;
  S.error = "";
  persist();
}

function removeUser(userId) {
  const target = S.users.find((u) => u.id === userId);
  if (!target) return;
  if (S.currentUser && S.currentUser.id === userId) {
    S.error = "Você não pode remover o seu próprio usuário enquanto estiver conectado.";
    render();
    return;
  }
  const remainingAdmins = S.users.filter((u) => u.isAdmin && u.id !== userId).length;
  if (target.isAdmin && remainingAdmins === 0) {
    S.error = "Não é possível remover o último administrador.";
    render();
    return;
  }
  S.users = S.users.filter((u) => u.id !== userId);
  S.error = "";
  persist();
}

function openEditUser(userId) {
  const user = S.users.find((u) => u.id === userId);
  S.editUser = user;
  S.editUserForm = {
    username: user.username,
    password: "",
    name: user.name || "",
    isAdmin: !!user.isAdmin,
    permissions: { ...emptyPermissions(), ...(user.permissions || {}) },
    actions: cloneActions(user.actions),
  };
  S.error = "";
  render();
}

function saveEditUser() {
  const username = S.editUserForm.username.trim();
  if (!username) { S.error = "Digite o nome de usuário."; render(); return; }
  if (S.users.some((u) => u.id !== S.editUser.id && u.username.toLowerCase() === username.toLowerCase())) {
    S.error = "Já existe um usuário com esse nome.";
    render();
    return;
  }
  const target = S.editUser;
  const wasAdmin = target.isAdmin;
  const willBeAdmin = !!S.editUserForm.isAdmin;
  if (wasAdmin && !willBeAdmin) {
    const remainingAdmins = S.users.filter((u) => u.isAdmin && u.id !== target.id).length;
    if (remainingAdmins === 0) {
      S.error = "Não é possível remover o status de administrador do último administrador.";
      render();
      return;
    }
  }
  target.username = username;
  if (S.editUserForm.password) target.password = S.editUserForm.password;
  target.name = S.editUserForm.name.trim();
  target.isAdmin = willBeAdmin;
  target.permissions = { ...S.editUserForm.permissions };
  target.actions = cloneActions(S.editUserForm.actions);

  if (S.currentUser && S.currentUser.id === target.id) S.currentUser = target;

  S.editUser = null;
  S.editUserForm = null;
  S.error = "";
  persist();
}

/* =========================================================
   Selecionadores (memos)
   ========================================================= */
function obraById() {
  const map = {};
  for (const o of S.obras) map[o.id] = o;
  return map;
}
function activeLoanByTool() {
  const map = {};
  for (const l of S.loans) if (!l.returnDate) map[l.toolId] = l;
  return map;
}
function activeMaintenanceByTool() {
  const map = {};
  for (const m of S.maintenances) if (!m.endDate) map[m.toolId] = m;
  return map;
}
function toolById() {
  const map = {};
  for (const t of S.tools) map[t.id] = t;
  return map;
}
function maintenanceRows() {
  return [...S.maintenances].sort((a, b) => {
    if (!a.endDate && b.endDate) return -1;
    if (a.endDate && !b.endDate) return 1;
    return b.startDate.localeCompare(a.startDate);
  });
}
function toolCountByObra() {
  const map = {};
  for (const t of S.tools) if (t.obraId) map[t.obraId] = (map[t.obraId] || 0) + 1;
  return map;
}
function filteredRows() {
  const alb = activeLoanByTool();
  return S.tools
    .map((t) => ({ tool: t, loan: alb[t.id] || null }))
    .filter(({ tool }) => {
      const q = S.search.trim().toLowerCase();
      return !q || tool.name.toLowerCase().includes(q);
    })
    .filter(({ tool }) => {
      const q = S.codeFilter.trim().toLowerCase();
      return !q || (tool.code || "").toLowerCase().includes(q);
    })
    .filter(({ tool }) => !S.obraFilter || tool.obraId === S.obraFilter)
    .filter(({ tool }) => {
      if (S.dateFrom && tool.createdAt && tool.createdAt < S.dateFrom) return false;
      if (S.dateTo && tool.createdAt && tool.createdAt > S.dateTo) return false;
      return true;
    })
    .filter(({ loan }) => {
      if (S.filter === "disponiveis") return !loan;
      if (S.filter === "emprestadas") return !!loan;
      return true;
    })
    .sort((a, b) => a.tool.name.localeCompare(b.tool.name, "pt-BR"));
}
function filteredHistory() {
  return S.history
    .filter((h) => {
      const q = S.historySearch.trim().toLowerCase();
      return !q || (h.toolName || "").toLowerCase().includes(q);
    })
    .filter((h) => {
      const q = S.historyCodeFilter.trim().toLowerCase();
      return !q || (h.toolCode || "").toLowerCase().includes(q);
    })
    .filter((h) => !S.historyObraFilter || h.obraId === S.historyObraFilter)
    .filter((h) => {
      if (S.historyDateFrom && h.date < S.historyDateFrom) return false;
      if (S.historyDateTo && h.date > S.historyDateTo) return false;
      return true;
    });
}
function availableToolsReport() {
  const alb = activeLoanByTool();
  return S.tools.filter((t) => !alb[t.id]).sort((a, b) => a.name.localeCompare(b.name, "pt-BR"));
}
function obraToolsReport() {
  if (!S.reportObraId) return { owned: [], rented: [] };
  return {
    owned: S.tools.filter((t) => t.obraId === S.reportObraId).sort((a, b) => a.name.localeCompare(b.name, "pt-BR")),
    rented: S.rentedTools.filter((r) => r.obraId === S.reportObraId).sort((a, b) => a.name.localeCompare(b.name, "pt-BR")),
  };
}

/* =========================================================
   Foco (preservar cursor entre re-renders)
   ========================================================= */
let focusMemo = null;
function captureFocus() {
  const el = document.activeElement;
  if (el && el.id && document.getElementById("app").contains(el)) {
    focusMemo = { id: el.id, start: el.selectionStart, end: el.selectionEnd };
  } else {
    focusMemo = null;
  }
}
function restoreFocus() {
  if (!focusMemo) return;
  const el = document.getElementById(focusMemo.id);
  if (el) {
    el.focus();
    if (typeof focusMemo.start === "number" && el.setSelectionRange) {
      try { el.setSelectionRange(focusMemo.start, focusMemo.end); } catch (e) {}
    }
  }
}

/* =========================================================
   Helpers para bind de campos
   ========================================================= */
function getPath(path) {
  return path.split(".").reduce((o, k) => (o == null ? undefined : o[k]), S);
}
function setPath(path, value) {
  const keys = path.split(".");
  let cur = S;
  for (let i = 0; i < keys.length - 1; i++) cur = cur[keys[i]];
  cur[keys[keys.length - 1]] = value;
}

  if (!S.currentUser) {
    app.innerHTML = renderLogin();
    restoreFocus();
    return;

  app.innerHTML = `

      ${renderSidebar()}
      <main class="main">
        ${S.error ? `<div class="error-banner">${escapeHtml(S.error)}</div>` : ""}
        ${S.saving ? `<div class="saving-banner">Salvando...</div>` : ""}

}

            ${S.preview.photos.map((src, i) => `
              <div class="preview-photo-wrap">
                <img src="${src}" alt="Foto ${i + 1}" class="preview-photo" data-action="openLightbox" data-source="preview" data-id="${i}" />
                ${canEditPhotos ? `
                  <div class="preview-photo-actions">
                    <label class="preview-photo-replace">
                      Trocar
                      <input type="file" accept="image/*" style="display:none" data-photo-target="preview" data-photo-index="${i}" />
                    </label>
                    <button type="button" class="photo-remove-btn" data-action="removePreviewPhoto" data-id="${i}">x</button>
                  </div>
                ` : ""}
              </div>
            `).join("")}
            ${canEditPhotos && S.preview.photos.length < MAX_PHOTOS ? `
              <label class="photo-add-btn photo-add-btn-lg">
                ${S.photoLoading ? "..." : "+ foto"}
                <input type="file" accept="image/*" multiple style="display:none" data-photo-target="preview" />
              </label>
            ` : ""}
          </div>
          ${S.error ? `<div class="modal-error">${escapeHtml(S.error)}</div>` : ""}
          <div class="inline-card-actions">
            <button class="ghost-btn" data-action="closePreview">Fechar</button>
          </div>
        </div>
      </div>
    `;
  }

  if (S.lightbox) {
    const photos = currentLightboxPhotos();
    const idx = S.lightbox.index;
    if (photos[idx]) {
      html += `
        <div class="modal-overlay lightbox-overlay" data-action="closeLightbox">
          <div class="lightbox-content" data-stop="1">
            <button class="lightbox-close" data-action="closeLightbox">&times;</button>
            <img src="${photos[idx]}" alt="Foto ampliada" class="lightbox-img" />
            ${photos.length > 1 ? `
              <button class="lightbox-nav lightbox-prev" data-action="lightboxPrev">&#10094;</button>
              <button class="lightbox-nav lightbox-next" data-action="lightboxNext">&#10095;</button>
              <div class="lightbox-counter">${idx + 1} / ${photos.length}</div>
            ` : ""}
          </div>
        </div>
      `;
    }
  }

  if (S.toolDetail && S.toolEditForm) {
    const alb = activeLoanByTool();
    const canEditTool = canDo(S.currentUser, "proprias", "editTool");
    const disabledAttr = canEditTool ? "" : "disabled";
    html += `
      <div class="modal-overlay" data-action="closeToolDetail">
        <div class="modal" data-stop="1">
          <div class="modal-title">Detalhes da ferramenta</div>
          ${S.toolDetail.photos && S.toolDetail.photos.length > 0 ? `
            <div class="preview-photos" style="margin-bottom:12px">
              ${S.toolDetail.photos.map((src, i) => `<img src="${src}" alt="Foto ${i + 1}" class="detail-photo" data-action="openLightbox" data-source="detail" data-id="${i}" />`).join("")}
            </div>
          ` : ""}
          <label class="modal-label">Nome</label>
          <input type="text" class="text-input" id="detail-name" data-bind="toolEditForm.name" value="${escapeAttr(S.toolEditForm.name)}" ${disabledAttr} />
          <label class="modal-label" style="margin-top:10px">Valor (R$)</label>
          <input type="text" inputmode="decimal" class="text-input" id="detail-value" data-bind="toolEditForm.value" value="${escapeAttr(S.toolEditForm.value)}" ${disabledAttr} />
          <label class="modal-label" style="margin-top:10px">Obra</label>
          <select class="select-input" id="detail-obra" data-bind="toolEditForm.obraId" ${disabledAttr}>
            <option value="">Sem obra vinculada</option>
            ${S.obras.map((o) => `<option value="${o.id}" ${S.toolEditForm.obraId === o.id ? "selected" : ""}>${escapeHtml(o.name)}</option>`).join("")}
          </select>
          <div class="detail-readonly-row">
            ${S.toolDetail.code ? `<span class="tag-code">Código: #${escapeHtml(S.toolDetail.code)}</span>` : "<span></span>"}
            <span class="${alb[S.toolDetail.id] ? "status-loaned-title" : "status-available"}">${alb[S.toolDetail.id] ? `Alocada com ${escapeHtml(alb[S.toolDetail.id].borrower)}` : "Disponível"}</span>
          </div>
          ${S.error ? `<div class="modal-error">${escapeHtml(S.error)}</div>` : ""}
          <div class="inline-card-actions">
            <button class="ghost-btn" data-action="closeToolDetail">${canEditTool ? "Cancelar" : "Fechar"}</button>
            ${canEditTool ? `<button class="primary-btn" data-action="saveToolDetail">Salvar alterações</button>` : ""}
          </div>
        </div>
      </div>
    `;
  }

  if (S.loanModal) {
    html += `
      <div class="modal-overlay">
        <div class="modal" data-stop="1">
          <div class="modal-title">Emprestar "${escapeHtml(S.loanModal.name)}"</div>
          <label class="modal-label">Quem está levando?</label>
          <input type="text" class="text-input" id="borrower-name" data-bind="borrowerName" value="${escapeAttr(S.borrowerName)}" placeholder="Nome do colega" autofocus />
          ${S.error ? `<div class="modal-error">${escapeHtml(S.error)}</div>` : ""}
          <div class="inline-card-actions">
            <button class="ghost-btn" data-action="closeLoanModal">Cancelar</button>
            <button class="primary-btn" data-action="confirmLoan">Confirmar empréstimo</button>
          </div>
        </div>
      </div>
    `;
  }

  if (S.maintenanceModal) {
    html += `
      <div class="modal-overlay">
        <div class="modal" data-stop="1">
          <div class="modal-title">Enviar "${escapeHtml(S.maintenanceModal.name)}" para manutenção</div>
          <label class="modal-label">Para qual local vai a manutenção?</label>
          <input type="text" class="text-input" id="maintenance-place" data-bind="maintenanceForm.place" value="${escapeAttr(S.maintenanceForm.place)}" placeholder="Nome da assistência / fornecedor" autofocus />
          <label class="modal-label" style="margin-top:10px">Valor da manutenção (R$)</label>
          <input type="text" inputmode="decimal" class="text-input" id="maintenance-value" data-bind="maintenanceForm.value" value="${escapeAttr(S.maintenanceForm.value)}" placeholder="Valor (opcional)" />
          <label class="modal-label" style="margin-top:10px">Previsão de entrega</label>
          <input type="date" class="text-input" id="maintenance-date" data-bind="maintenanceForm.expectedDelivery" value="${S.maintenanceForm.expectedDelivery}" />
          ${S.error ? `<div class="modal-error">${escapeHtml(S.error)}</div>` : ""}
          <div class="inline-card-actions">
            <button class="ghost-btn" data-action="closeMaintenanceModal">Cancelar</button>
            <button class="primary-btn" data-action="confirmMaintenance">Enviar para manutenção</button>
          </div>
        </div>
      </div>
    `;
  }

  if (S.editMaintenance && S.editMaintenanceForm) {
    const tbi = toolById();
    const tool = tbi[S.editMaintenance.toolId];
    html += `
      <div class="modal-overlay" data-action="closeEditMaintenance">
        <div class="modal" data-stop="1">
          <div class="modal-title">Editar manutenção${tool ? ` de "${escapeHtml(tool.name)}"` : ""}</div>
          <label class="modal-label">Local da manutenção</label>
          <input type="text" class="text-input" id="edit-maintenance-place" data-bind="editMaintenanceForm.place" value="${escapeAttr(S.editMaintenanceForm.place)}" />
          <label class="modal-label" style="margin-top:10px">Valor da manutenção (R$)</label>
          <input type="text" inputmode="decimal" class="text-input" id="edit-maintenance-value" data-bind="editMaintenanceForm.value" value="${escapeAttr(S.editMaintenanceForm.value)}" />
          <label class="modal-label" style="margin-top:10px">Previsão de entrega</label>
          <input type="date" class="text-input" id="edit-maintenance-date" data-bind="editMaintenanceForm.expectedDelivery" value="${S.editMaintenanceForm.expectedDelivery}" />
          ${S.error ? `<div class="modal-error">${escapeHtml(S.error)}</div>` : ""}
          <div class="inline-card-actions">
            <button class="ghost-btn" data-action="closeEditMaintenance">Cancelar</button>
            <button class="primary-btn" data-action="saveEditMaintenance">Salvar alterações</button>
          </div>
        </div>
      </div>
    `;
  }

  if (S.editUser && S.editUserForm) {
    html += `
      <div class="modal-overlay" data-action="closeEditUser">
        <div class="modal" data-stop="1">
          <div class="modal-title">Editar usuário "${escapeHtml(S.editUser.username)}"</div>
          <label class="modal-label">Nome de usuário (login)</label>
          <input type="text" class="text-input" id="edit-user-username" data-bind="editUserForm.username" value="${escapeAttr(S.editUserForm.username)}" />
          <label class="modal-label" style="margin-top:10px">Nova senha</label>
          <input type="password" class="text-input" id="edit-user-password" data-bind="editUserForm.password" value="${escapeAttr(S.editUserForm.password)}" placeholder="Deixe em branco para manter a senha atual" />
          <label class="modal-label" style="margin-top:10px">Nome (opcional)</label>
          <input type="text" class="text-input" id="edit-user-name" data-bind="editUserForm.name" value="${escapeAttr(S.editUserForm.name)}" />
          <div class="checkbox-row" style="margin-top:12px">
            <input type="checkbox" id="edit-user-admin" data-bind="editUserForm.isAdmin" ${S.editUserForm.isAdmin ? "checked" : ""} />
            <label for="edit-user-admin">Administrador (acesso total, incluindo Usuários)</label>
          </div>
          ${renderPermissionsEditor("edit-user", "editUserForm", S.editUserForm.isAdmin, S.editUserForm.permissions, S.editUserForm.actions)}
          ${S.error ? `<div class="modal-error">${escapeHtml(S.error)}</div>` : ""}
          <div class="inline-card-actions">
            <button class="ghost-btn" data-action="closeEditUser">Cancelar</button>
            <button class="primary-btn" data-action="saveEditUser">Salvar alterações</button>
          </div>
        </div>
      </div>
    `;
  }

  return html;
}

/* =========================================================
   Delegacao de eventos
   ========================================================= */
const ACTION_PERMISSION = {
  toggleAddTool: ["proprias", "addTool"],
  addTool: ["proprias", "addTool"],
  removeTool: ["proprias", "removeTool"],
  saveToolDetail: ["proprias", "editTool"],
  openLoanModal: ["proprias", "loan"],
  confirmLoan: ["proprias", "loan"],
  returnTool: ["proprias", "loan"],
  openMaintenanceModal: ["proprias", "maintenanceStart"],
  confirmMaintenance: ["proprias", "maintenanceStart"],
  concludeMaintenance: ["manutencao", "conclude"],
  openEditMaintenance: ["manutencao", "edit"],
  saveEditMaintenance: ["manutencao", "edit"],
  removeMaintenance: ["manutencao", "remove"],
  toggleAddRented: ["alugadas", "add"],
  addRentedTool: ["alugadas", "add"],
  removeRentedTool: ["alugadas", "remove"],
  toggleAddObra: ["obras", "add"],
  addObra: ["obras", "add"],
  removeObra: ["obras", "remove"],
  exportAvailableExcel: ["relatorios", "exportExcel"],
  exportObraExcel: ["relatorios", "exportExcel"],
  exportAvailablePdf: ["relatorios", "exportPdf"],
  exportObraPdf: ["relatorios", "exportPdf"],
};

function handleAction(action, id, btn) {
  const req = ACTION_PERMISSION[action];
  if (req && !canDo(S.currentUser, req[0], req[1])) {
    S.error = "Você não tem permissão para essa ação.";
    render();
    return;
  }
  switch (action) {
    case "setPage":
      if (canAccessPage(S.currentUser, id)) S.page = id;
      render();
      break;
    case "doLogin": doLogin(); break;
    case "doLogout": doLogout(); break;
    case "toggleAddUser": S.showAddUser = true; S.error = ""; render(); break;
    case "cancelAddUser": S.showAddUser = false; S.newUser = emptyUser(); S.error = ""; render(); break;
    case "addUser": addUser(); break;
    case "removeUser": removeUser(id); break;
    case "openEditUser": openEditUser(id); break;
    case "closeEditUser": S.editUser = null; S.editUserForm = null; S.error = ""; render(); break;
    case "saveEditUser": saveEditUser(); break;
    case "setFilter": S.filter = id; render(); break;
    case "toggleAddTool": S.showAddTool = true; S.error = ""; render(); break;
    case "cancelAddTool": S.showAddTool = false; S.newTool = emptyTool(); S.error = ""; render(); break;
    case "addTool": addTool(); break;
    case "removeNewPhoto": removeNewPhoto(Number(id)); break;
    case "removeTool": removeTool(id); break;
    case "openToolDetail": openToolDetail(id); break;
    case "closeToolDetail": S.toolDetail = null; S.toolEditForm = null; S.error = ""; if (S.lightbox && S.lightbox.source === "detail") S.lightbox = null; render(); break;
    case "saveToolDetail": saveToolDetail(); break;
    case "openLoanModal": openLoanModal(id); break;
    case "closeLoanModal": S.loanModal = null; S.error = ""; render(); break;
    case "confirmLoan": confirmLoan(); break;
    case "returnTool": returnTool(id); break;
    case "openMaintenanceModal": openMaintenanceModal(id); break;
    case "closeMaintenanceModal": S.maintenanceModal = null; S.error = ""; render(); break;
    case "confirmMaintenance": confirmMaintenance(); break;
    case "concludeMaintenance": concludeMaintenance(id); break;
    case "removeMaintenance": removeMaintenance(id); break;
    case "openEditMaintenance": openEditMaintenance(id); break;
    case "closeEditMaintenance": S.editMaintenance = null; S.editMaintenanceForm = null; S.error = ""; render(); break;
    case "saveEditMaintenance": saveEditMaintenance(); break;
    case "setPreview": S.preview = S.tools.find((t) => t.id === id); S.error = ""; render(); break;
    case "closePreview": S.preview = null; S.lightbox = null; S.error = ""; render(); break;
    case "removePreviewPhoto": removePreviewPhoto(id); break;
    case "openLightbox": openLightbox(btn.getAttribute("data-source"), id); break;
    case "closeLightbox": closeLightbox(); break;
    case "lightboxPrev": lightboxPrev(); break;
    case "lightboxNext": lightboxNext(); break;
    case "toggleAddObra": S.showAddObra = true; S.error = ""; render(); break;
    case "cancelAddObra": S.showAddObra = false; S.newObra = emptyObra(); S.error = ""; render(); break;
    case "addObra": addObra(); break;
    case "removeObra": removeObra(id); break;
    case "toggleAddRented": S.showAddRented = true; S.error = ""; render(); break;
    case "cancelAddRented": S.showAddRented = false; S.newRented = emptyRented(); S.error = ""; render(); break;
    case "addRentedTool": addRentedTool(); break;
    case "removeRentedTool": removeRentedTool(id); break;
    case "clearPropriasFilters": S.codeFilter = ""; S.obraFilter = ""; S.dateFrom = ""; S.dateTo = ""; render(); break;
    case "clearHistoryFilters": S.historyCodeFilter = ""; S.historyObraFilter = ""; S.historyDateFrom = ""; S.historyDateTo = ""; render(); break;
    case "exportAvailableExcel": exportToExcel(availableExportRows(), AVAILABLE_COLUMNS, "ferramentas-disponiveis.xlsx"); break;
    case "exportAvailablePdf": downloadPdfReport("Ferramentas disponíveis", availableExportRows(), AVAILABLE_COLUMNS, "ferramentas-disponiveis.pdf"); break;
    case "exportObraExcel": {
      const obMap = obraById();
      const name = (obMap[S.reportObraId] || {}).name || "obra";
      exportToExcel(obraExportRows(), OBRA_COLUMNS, `ferramentas-${name}.xlsx`);
      break;
    }
    case "exportObraPdf": {
      const obMap = obraById();
      const name = (obMap[S.reportObraId] || {}).name || "";
      downloadPdfReport(`Ferramentas da obra ${name}`, obraExportRows(), OBRA_COLUMNS, `ferramentas-${name || "obra"}.pdf`);
      break;
    }
  }
}

document.addEventListener("DOMContentLoaded", () => {
  const app = document.getElementById("app");

  app.addEventListener("click", (e) => {
    const overlay = e.target.closest(".modal-overlay");
    if (overlay && e.target === overlay) {
      const action = overlay.getAttribute("data-action");
      if (action) { handleAction(action, null, overlay); return; }
    }
    const btn = e.target.closest("[data-action]");
    if (!btn) return;
    // Se o unico [data-action] encontrado subindo na arvore for o proprio overlay,
    // significa que o clique aconteceu dentro do modal (ex: label de foto) sem
    // atingir nenhum botao real - nesse caso nao deve fechar o modal.
    if (btn.classList.contains("modal-overlay")) return;
    const action = btn.getAttribute("data-action");
    const id = btn.getAttribute("data-id");
    handleAction(action, id, btn);
  });

  app.addEventListener("input", (e) => {
    if (e.target.type === "checkbox") return;
    const bind = e.target.getAttribute("data-bind");
    if (!bind) return;
    captureFocus();
    setPath(bind, e.target.value);
    render();
  });

  app.addEventListener("change", (e) => {
    const bind = e.target.getAttribute("data-bind");
    if (bind && e.target.type === "checkbox") {
      captureFocus();
      setPath(bind, e.target.checked);
      render();
      return;
    }
    if (bind && e.target.tagName === "SELECT") {
      captureFocus();
      setPath(bind, e.target.value);
      render();
      return;
    }
    if (e.target.matches('input[type="file"][data-photo-target]')) {
      handlePhotoSelect(e.target);
    }
  });

  app.addEventListener("keydown", (e) => {
    if (e.key === "Enter") {
      const el = e.target.closest("[data-enter-action]");
      if (el) {
        e.preventDefault();
        handleAction(el.getAttribute("data-enter-action"), null, el);
      }
      return;
    }
    if (e.key === "Escape" && S.lightbox) {
      closeLightbox();
      return;
    }
    if (e.key === "ArrowLeft" && S.lightbox) { lightboxPrev(); return; }
    if (e.key === "ArrowRight" && S.lightbox) { lightboxNext(); return; }
  });

  loadData();
});
</script>
</body>
</html>
